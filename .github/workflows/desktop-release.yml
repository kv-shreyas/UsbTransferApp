name: Desktop Production Release

on:
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub Actions tab
  push:
    tags:
      - 'v*' # Automatically triggers when you push a tag like "v1.0.0"

jobs:
  build-windows:
    name: Build Windows MSI & EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Windows Installers (MSI & EXE)
        run: ./gradlew.bat :composeApp:packageReleaseMsi :composeApp:packageReleaseExe

      - name: Rename Windows Installer files
        run: |
          cd composeApp/build/compose/binaries/main-release/msi/
          mv *.msi SecureQuickTransfer-Setup.msi
          cd ../exe/
          mv *.exe SecureQuickTransfer-Setup.exe
        shell: bash

      - name: Upload Windows Installers Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureQuickTransfer-Windows
          path: |
            composeApp/build/compose/binaries/main-release/msi/SecureQuickTransfer-Setup.msi
            composeApp/build/compose/binaries/main-release/exe/SecureQuickTransfer-Setup.exe
          retention-days: 7

  build-linux:
    name: Build Linux DEB & Standalone JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux Installer (DEB) and Standalone JAR
        run: ./gradlew :composeApp:packageReleaseDeb :composeApp:packageReleaseUberJarForCurrentOS

      - name: Prepare Linux distribution files
        run: |
          mkdir -p dist/linux
          cp composeApp/build/compose/binaries/main-release/deb/*.deb dist/linux/SecureQuickTransfer-Setup.deb
          cp composeApp/build/compose/jars/*.jar dist/linux/SecureQuickTransfer.jar
        shell: bash

      - name: Upload Linux Artifacts (DEB & JAR)
        uses: actions/upload-artifact@v4
        with:
          name: SecureQuickTransfer-Linux
          path: dist/linux/
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SecureQuickTransfer-Windows
          path: ./artifacts/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: SecureQuickTransfer-Linux
          path: ./artifacts/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./artifacts/windows/**/SecureQuickTransfer-Setup.msi
            ./artifacts/windows/**/SecureQuickTransfer-Setup.exe
            ./artifacts/linux/**/SecureQuickTransfer-Setup.deb
            ./artifacts/linux/**/SecureQuickTransfer.jar
          draft: false
          prerelease: false
